name: Build Vibe Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: flutter create --project-name vibe_app --platforms=android build_project
      - name: Copy Vibe application source
        run: |
          cp pubspec.yaml build_project/pubspec.yaml
          mkdir -p build_project/lib
          cp lib/main.dart build_project/lib/main.dart
      - name: Resolve dependencies
        working-directory: build_project
        run: flutter pub get
      - name: Build release APK
        working-directory: build_project
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Android-APK
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
